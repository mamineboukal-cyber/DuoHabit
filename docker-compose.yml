services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: duohabits
      POSTGRES_PASSWORD: duohabits
      POSTGRES_DB: duohabits
    ports:
      - "5432:5432"
    volumes:
      - duohabits_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duohabits -d duohabits"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  duohabits_pgdata:

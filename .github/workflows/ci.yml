name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: duohabits
          POSTGRES_PASSWORD: duohabits
          POSTGRES_DB: duohabits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duohabits -d duohabits_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci-only-secret-key-that-is-at-least-32-chars
      TEST_DATABASE_URL: postgresql+psycopg://duohabits:duohabits@localhost:5432/duohabits_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Apply migrations to a clean database
        run: flask --app wsgi db upgrade

      - name: Test
        run: pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
